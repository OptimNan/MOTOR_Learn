<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扫一扫 - MOTOR_Learn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: #1a73e8;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .scan-icon {
      width: 28px;
      height: 28px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .scanner-wrapper {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      min-height: 280px;
    }

    #reader {
      width: 100%;
    }

    .viewfinder {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .viewfinder::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      aspect-ratio: 1;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 4px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
    }

    .scan-line {
      position: absolute;
      top: 50%;
      left: 20%;
      width: 60%;
      height: 2px;
      background: #1a73e8;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0%   { transform: translateY(-70px); opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(70px); opacity: 0; }
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #startBtn {
      background: #1a73e8;
      color: #fff;
    }

    #startBtn:not(:disabled):hover {
      background: #1558c0;
    }

    #stopBtn {
      background: #e8f0fe;
      color: #1a73e8;
    }

    #stopBtn:not(:disabled):hover {
      background: #d2e3fc;
    }

    .result-card {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: none;
    }

    .result-card.visible {
      display: block;
    }

    .result-card h2 {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #resultText {
      font-size: 16px;
      word-break: break-all;
      color: #202124;
    }

    #resultLink {
      display: inline-block;
      margin-top: 10px;
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
    }

    #resultLink:hover {
      text-decoration: underline;
    }

    #copyBtn {
      margin-top: 14px;
      background: #f1f3f4;
      color: #202124;
      padding: 8px 18px;
      font-size: 13px;
    }

    #copyBtn:hover {
      background: #e8eaed;
    }

    .status {
      font-size: 13px;
      color: #5f6368;
      text-align: center;
    }

    .status.error {
      color: #d93025;
    }

    .status.success {
      color: #188038;
    }

    .instructions {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .instructions h3 {
      font-size: 15px;
      color: #202124;
      margin-bottom: 10px;
    }

    .instructions ol {
      padding-left: 18px;
      color: #5f6368;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header>
    <svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 7 4 4 7 4"/>
      <polyline points="17 4 20 4 20 7"/>
      <polyline points="4 17 4 20 7 20"/>
      <polyline points="17 20 20 20 20 17"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    <h1>扫一扫</h1>
  </header>

  <div class="container">
    <div class="scanner-wrapper">
      <div id="reader"></div>
      <div class="viewfinder">
        <div class="scan-line"></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">开始扫描</button>
      <button id="stopBtn" disabled>停止</button>
    </div>

    <p class="status" id="status">点击"开始扫描"以启动摄像头</p>

    <div class="result-card" id="resultCard">
      <h2>扫描结果</h2>
      <p id="resultText"></p>
      <a id="resultLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">打开链接 →</a>
      <button id="copyBtn">复制内容</button>
    </div>

    <div class="instructions">
      <h3>使用说明</h3>
      <ol>
        <li>点击"开始扫描"，允许摄像头权限</li>
        <li>将二维码或条形码对准取景框</li>
        <li>自动识别后结果显示在下方</li>
        <li>如为链接，可点击直接跳转</li>
      </ol>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const resultCard = document.getElementById("resultCard");
    const resultText = document.getElementById("resultText");
    const resultLink = document.getElementById("resultLink");
    const copyBtn = document.getElementById("copyBtn");

    // Single reusable scanner instance created once the DOM is ready.
    const html5QrCode = new Html5Qrcode("reader");
    let scanning = false;

    function isURL(str) {
      try {
        const url = new URL(str);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch {
        return false;
      }
    }

    function onScanSuccess(decodedText) {
      resultCard.classList.add("visible");
      resultText.textContent = decodedText;

      if (isURL(decodedText)) {
        resultLink.href = decodedText;
        resultLink.style.display = "inline-block";
      } else {
        resultLink.style.display = "none";
      }

      statusEl.textContent = "扫描成功！";
      statusEl.className = "status success";
    }

    function onScanFailure() {
      // Silently ignore per-frame failures; only log unexpected errors.
    }

    startBtn.addEventListener("click", async () => {
      if (scanning) return;

      startBtn.disabled = true;
      statusEl.textContent = "正在启动摄像头…";
      statusEl.className = "status";
      resultCard.classList.remove("visible");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScanSuccess,
          onScanFailure
        );
        scanning = true;
        stopBtn.disabled = false;
        statusEl.textContent = "摄像头已启动，请对准二维码";
      } catch (err) {
        startBtn.disabled = false;
        statusEl.textContent = "无法访问摄像头：" + err.message;
        statusEl.className = "status error";
      }
    });

    stopBtn.addEventListener("click", async () => {
      if (!scanning) return;
      await html5QrCode.stop();
      scanning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusEl.textContent = "扫描已停止";
      statusEl.className = "status";
    });

    copyBtn.addEventListener("click", () => {
      const text = resultText.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = copyBtn.textContent;
        copyBtn.textContent = "已复制 ✓";
        setTimeout(() => { copyBtn.textContent = orig; }, 1500);
      });
    });
  </script>
</body>
</html>
